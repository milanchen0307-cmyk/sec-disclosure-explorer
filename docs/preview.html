  if(e.extreme)add('X',T('f.X.t',pc(e.maxAbs.r),fmtD(e.maxAbs.day)));
  if(!n)h('span',{class:'badge'},fl,T('f.ok'));
  $('sec-prev').disabled=pos===0;$('sec-next').disabled=pos===list.length-1;
  $('sec-live').textContent=T('live',e.t,e.form,e.fd,pos+1,list.length,n);
}
function compact(arr){var out=[],a=arr[0],b=arr[0];for(var i=1;i<=arr.length;i++){if(arr[i]===b+1){b=arr[i];continue;}out.push(a===b?fmtD(a):fmtD(a)+'…'+fmtD(b));a=b=arr[i];}return out.join(', ');}

/* all-filings table */
function renderAllTable(){var tb=$('sec-all-t');clear(tb);TICKERS.forEach(function(t){BY[t].forEach(function(e){var tr=h('tr',null,tb);h('td',{class:'mono'},tr,e.t);h('td',null,tr,e.form);h('td',{class:'mono'},tr,e.fd);h('td',{class:'mono'},tr,e.d0);
  var td=h('td',{class:'mono'},tr);h('a',{href:e.url},td,e.acc);
  h('td',{class:'mono r'},tr,pc(e.w.filter(function(p){return p.day===0;})[0].r,2));h('td',{class:'mono r'},tr,T('all.last',pc(e.w[e.w.length-1].r,2),e.maxDay));
  h('td',null,tr,flagCodes(e).split('').map(flagName).join(lang==='zh'?'、':', '));});});}

/* ---------- selection ---------- */
function select(i,push){
  state.ev=i;var e=EV[i];
  selCo.value=e.t;
  $('sec-ghost-label').textContent=T('ghost.label',ghostsOf(e).length);
  renderKpis();renderFiles();drawStrip();drawChart();renderCase();
  if(push&&window.history&&history.replaceState){try{history.replaceState(null,'','#'+e.acc);}catch(err){}}
}
$('sec-prev').addEventListener('click',function(){var e=EV[state.ev],l=BY[e.t],p=l.indexOf(e);if(p>0)select(l[p-1].i,true);});
$('sec-next').addEventListener('click',function(){var e=EV[state.ev],l=BY[e.t],p=l.indexOf(e);if(p<l.length-1)select(l[p+1].i,true);});
$('sec-ghost').addEventListener('change',function(){state.ghost=this.checked;drawChart();});
document.querySelectorAll('input[name="sec-y"]').forEach(function(r){r.addEventListener('change',function(){state.y=this.value;drawChart();});});
function fromHash(){var acc=decodeURIComponent((location.hash||'').slice(1));var f=EV.filter(function(e){return e.acc===acc;})[0];return f?f.i:null;}
window.addEventListener('hashchange',function(){var i=fromHash();if(i!=null&&i!==state.ev)select(i,false);});
/* language switch: re-render text, picker, tables and the current filing (state is kept) */
function renderLang(){applyStatic();renderCoSelect();renderAllTable();select(state.ev,false);}
each('[data-lang]',function(btn){btn.addEventListener('click',function(){
  lang=btn.getAttribute('data-lang');
  try{window.localStorage.setItem(LS_KEY,lang);}catch(e){}
  renderLang();
});});
var init=fromHash();
state.ev=init!=null?init:EV.reduce(function(a,b){return Math.abs(a.maxAbs.r)>Math.abs(b.maxAbs.r)?a:b;}).i;
renderLang();
var rt=null,lw=0;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var w=$('sec-ch-host').clientWidth;if(w!==lw){lw=w;drawStrip();drawChart();}},120);});
})();
</script>
</body>
</html>
